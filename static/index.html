      "          }",
      "          if (v > 1) v = 1; else if (v < -1) v = -1;",
      "          out[j * this.outCh + c] = Math.round(v * 32767);",
      "        }",
      "      }",
      "      this.append(out);",
      "      return true;",
      "    }",
      "    let frames = Math.ceil(n / this.ratio) + 1;",
      "    const out = new Int16Array(frames * this.outCh);",
      "    let p = this.pos;",
      "    let j = 0;",
      "    while (p < n && j < frames) {",
      "      let i0 = Math.floor(p);",
      "      const f = p - i0;",
      "      let i1 = i0 + 1;",
      "      if (i0 > n - 1) i0 = n - 1;",
      "      if (i1 > n - 1) i1 = n - 1;",
      "      for (let c = 0; c < this.outCh; c++) {",
      "        const src = inp[c < inCh ? c : 0];",
      "        let v = (src[i0] + (src[i1] - src[i0]) * f) * this.gain;",

      
      
      
      
      
      
      "        }",
      "        if (v > 1) v = 1; else if (v < -1) v = -1;",
      "        out[j * this.outCh + c] = Math.round(v * 32767);",
      "      }",
      "      j++;",
      "      p += this.ratio;",
      "    }",
      "    this.pos = p - n;",
      "    this.append(j === frames ? out : out.slice(0, j * this.outCh));",
      "    return true;",
      "  }",
      "}",
      "registerProcessor('mic-capture', MicCapture);"
    ].join('\n');
    let micStream = null;
    let micCtx = null;
    let micProc = null;
    let micSilent = null;
    let micArmed = false;   // UI toggle: user allowed mic use
    let micDebugOpen = false; // раскрыт ли блок диагностики (по умолчанию — нет)
    let micLive = false;    // server holds capture open (rdpOnMicOpen)
    let micRate = 0;        // agreed sample rate from server
    let micCh = 0;          // agreed channel count from server
    let micFpp = 0;         // FramesPerPacket из OPEN (размер пакета данных)
    let micNode = null;     // AudioWorkletNode — основной путь захвата
    let micNodeSrc = null;  // MediaStreamAudioSourceNode
    let micWorkletURL = null;
    let micRateTimer = null; // метрика «кБ/с отправки»
    let micRateBytes = 0;
    let micRateLast = 0;

    let micLevelTimer = null;

    function micSecure() { return window.isSecureContext === true; }

    // micSavedDevice — сохранённый deviceId (cookie rdp_micdev).
    function micSavedDevice() { return getCookie('rdp_micdev') || ''; }

    // micRefreshDevices заполняет список устройств ввода. Метки появляются
    // только после выдачи разрешения, поэтому вызывается и при включении.
    async function micRefreshDevices() {
      const sel = document.getElementById('micDevice');
      if (!sel || !navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      try {
        const devs = await navigator.mediaDevices.enumerateDevices();
        const cur = sel.value || micSavedDevice();
        sel.textContent = '';
        const def = document.createElement('option');
        def.value = '';
        def.textContent = 'Микрофон: по умолчанию';
        sel.appendChild(def);
        let n = 0;
        let haveIds = false;   // до выдачи разрешения браузер отдаёт пустые id
        const ids = [];
        devs.forEach(function (d) {
          if (d.kind !== 'audioinput') return;
          n++;
          if (d.deviceId) { haveIds = true; ids.push(d.deviceId); }
          const o = document.createElement('option');
          o.value = d.deviceId || '';
          o.textContent = d.label || ('Микрофон ' + n);
          sel.appendChild(o);
        });
        // Устройство могло исчезнуть (наушники отключили) — тогда saved id
        // приведёт к OverconstrainedError; чистим куку. Но только если список
        // реально содержит deviceId: иначе (нет разрешения) не трогаем.
        if (cur && haveIds && ids.indexOf(cur) === -1) {
          sel.value = '';
          setCookie('rdp_micdev', '');
        } else if (cur && ids.indexOf(cur) !== -1) {
          sel.value = cur;
        }
      } catch (_) {}
    }

    // micDeviceChanged — сменили устройство: перезапустить захват, если включён.
    function micDeviceChanged() {
      const sel = document.getElementById('micDevice');
      if (!sel) return;
      setCookie('rdp_micdev', sel.value || '');
      if (micArmed) { micStop(); micToggle(); }
    }

    // micLevelShow — полоска уровня по накопленному пику (масштаб ×3 для наглядности).
    function micLevelShow() {
      const pct = Math.min(100, Math.round(micPeak / 32768 * 300));
      const el = document.querySelector('#micLevel i');
      if (el) el.style.width = pct + '%';
      const mEl = document.querySelector('#miniLevel i');
      if (mEl) mEl.style.width = pct + '%';
    }

    function micUpdateBtn() {
      const b = document.getElementById('micBtn');
      if (!b) return;
      if (!micSecure()) {
        b.disabled = true;
        b.title = 'Микрофон доступен только по HTTPS (панель, порт 8443)';
        return;
      }
      b.disabled = false;
      // «live» (красная) = и захват включён, и сервер держит канал открытым.
      const live = micLive && micArmed;
      b.classList.toggle('armed', micArmed);
      b.classList.toggle('live', live);
      b.title = !micArmed ? 'Включить микрофон (передача в RDP-сессию)' :
        (micLive ? 'Микрофон идёт в сессию — нажать чтобы выключить' :
         'Микрофон включён, ждёт запроса от сервера — нажать чтобы выключить');
      const m = document.getElementById('miniMic');
      if (m) {
        m.style.display = (micArmed && connected) ? '' : 'none';
        m.classList.toggle('live', live);
        m.textContent = live ? '● MIC' : '○ MIC';
        m.title = b.title;
      }
      const lv = document.getElementById('miniLevel');
      if (lv) lv.style.display = live ? '' : 'none';
    }

    // updateMiniConn — кнопка подключения в свёрнутом островке: видна, когда
    // сессии нет (быстрое переподключение без разворачивания панели).
    function updateMiniConn() {
      const b = document.getElementById('miniConnBtn');
      if (!b) return;
      b.style.display = connected ? 'none' : '';
      b.textContent = everConnected ? 'Переподключиться' : 'Подключиться';
    }

    // humanizeRdpError — типовые ошибки соединения человеческим языком.
    // Точные формулировки Go/прокси нестабильны, поэтому матчим подстроки
    // (регистр не важен); исходный текст остаётся в title строки статуса.
    function humanizeRdpError(msg) {
      const raw = String(msg || '');
      const low = raw.toLowerCase();
      const map = [
        [['logon_failure', 'logon failure', 'invalid credentials', 'authentication failed',
          'wrong password', 'account restrictions', 'nla'], 'Неверный логин или пароль (или домен)'],
        [['account locked', 'locked out'], 'Учётная запись заблокирована на удалённом ПК'],
        [['password expired', 'password must change'], 'Пароль истёк — его нужно сменить на удалённом ПК'],
        [['reset by peer'], 'Соединение сброшено удалённой стороной'],
        [['websocket closed', 'ws closed'], 'Соединение прервано: сессию закрыла удалённая сторона или сеть'],
        [['websocket error', 'dial tcp', 'connection refused'], 'Не удалось подключиться: хост недоступен (RDP выключен или порт закрыт)'],
        [['no route to host', 'network is unreachable'], 'Хост недоступен: нет маршрута (проверьте адрес и сеть)'],
        [['timeout', 'deadline exceeded'], 'Превышено время ожидания: хост не отвечает'],
        [['not allowed', 'forbidden'], 'Этот хост запрещён настройками прокси (allow-target)'],
        [['tls', 'certificate', 'x509'], 'Ошибка TLS/сертификата при подключении'],
        [['closed'], 'Сессия закрыта'],
      ];
      for (let i = 0; i < map.length; i++) {
        const keys = map[i][0];
        for (let j = 0; j < keys.length; j++) {
          if (low.indexOf(keys[j]) !== -1) return map[i][1];
        }
      }
      return raw || 'Неизвестная ошибка';
    }

    // micOnPacket — пакет PCM из worklet (уже ровно FramesPerPacket).
    function micOnPacket(e) {
      const d = e.data || {};
      if (!d.pcm) return;
      const u8 = new Uint8Array(d.pcm);
      micChunks++;
      micRateBytes += u8.length;
      if (typeof d.peak === 'number' && d.peak > micPeak) micPeak = d.peak;
      if (micChunks === 1) rdpOnMicProgress('capture');
      else if (micChunks === 100) rdpOnMicProgress('capmany');
      try {
        if (typeof rdpMicPush === 'function') rdpMicPush(u8);
      } catch (_) {}
    }

    // micRateMeterStart — раз в секунду показывает фактическую скорость
    // отправки и ожидаемую (rate × каналы × 2 байта). Главная метрика
    // для проверки «звук идёт в реальном времени».
    function micRateMeterStart() {
      micRateBytes = 0;
      micRateLast = Date.now();
      if (micRateTimer) clearInterval(micRateTimer);
      micRateTimer = setInterval(function () {
        const now = Date.now();
        const dt = (now - micRateLast) / 1000;
        micRateLast = now;
        if (dt <= 0) return;
        const got = Math.round(micRateBytes / dt / 1000);
        micRateBytes = 0;
        const exp = Math.round((micRate * (micCh || 1) * 2) / 1000);
        rdpOnMicProgress('rate' + got + '/' + exp);
      }, 1000);
    }

    // micStartCapture — подключить захват: AudioWorklet на аудиопотоке,
    // при неудаче — прежний ScriptProcessor (фолбэк).
    async function micStartCapture() {
      const src = micCtx.createMediaStreamSource(micStream);
      micNodeSrc = src;
      micSilent = micCtx.createGain();
      micSilent.gain.value = 0;
      micSilent.connect(micCtx.destination);
      let started = false;
      if (micCtx.audioWorklet && typeof AudioWorkletNode === 'function') {
        try {
          if (!micWorkletURL) {
            micWorkletURL = URL.createObjectURL(
              new Blob([MIC_WORKLET_SRC], { type: 'application/javascript' }));
          }
          await micCtx.audioWorklet.addModule(micWorkletURL);
          micNode = new AudioWorkletNode(micCtx, 'mic-capture', {
            numberOfInputs: 1,
            numberOfOutputs: 1,
            outputChannelCount: [1],
processorOptions: {
              rate: micRate | 0,
              outCh: (micCh | 0) || 1,
              framesPerPacket: (micFpp | 0) || 160,
              gain: 5,
            },
          });
          micNode.port.onmessage = micOnPacket;
          src.connect(micNode);
          micNode.connect(micSilent);
          started = true;
          rdpOnMicProgress('worklet');
        } catch (_) {
          try { if (micNode) micNode.disconnect(); } catch (_) {}
          micNode = null;
        }
      }
      if (!started) {
        const inCh = src.channelCount || 1;
        micProc = micCtx.createScriptProcessor(4096, inCh, inCh);
        micProc.onaudioprocess = micProcess;
        src.connect(micProc);
        micProc.connect(micSilent);
        rdpOnMicProgress('noworklet');
      }
      micRateMeterStart();
    }

    async function micToggle() {
      if (!micSecure()) {
        document.getElementById('status').textContent =
          'Микрофон: нужен HTTPS (откройте панель по https, порт 8443)';
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        document.getElementById('status').textContent =
          'Микрофон: браузер не даёт API захвата (mediaDevices недоступен)';
        return;
      }
      if (typeof rdpMicPush !== 'function' || typeof rdpMicSetEnabled !== 'function') {
        // Старый main.wasm из кеша (без audin): страница новая, а билд старый.
        document.getElementById('status').textContent =
          'WASM без микрофона — обновите страницу жёстко (Ctrl+F5)';
        return;
      }
      if (micArmed) { micStop(); return; }
      try {
        if (!micStream) {
          const dev = (document.getElementById('micDevice') || {}).value || micSavedDevice();
          // Обработку звука выключаем: AEC/шумодав/AGC занижали уровень
          // на 6-7 дБ и «гейтили» тихую речь (замерено по WAV).
          const ac = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
          if (dev) ac.deviceId = { ideal: dev };
          micStream = await navigator.mediaDevices.getUserMedia({ audio: ac });
          micRefreshDevices();
        }
        if (!micCtx || micCtx.state === 'closed') {
          // Если сервер уже назвал частоту — просим контекст сразу на ней:
          // тогда ресемплинг не нужен вовсе.
          try {
            micCtx = new AudioContext(micRate > 0 ? { sampleRate: micRate } : {});
          } catch (_) {
            micCtx = new AudioContext();
          }
        }
        if (micCtx.state === 'suspended') await micCtx.resume();
        await micStartCapture();
        micArmed = true;
        micPeak = 0;
        micLevelShow();
        if (micLevelTimer) clearInterval(micLevelTimer);
        micLevelTimer = setInterval(function () {
          micPeak = Math.floor(micPeak * 0.6);
          micLevelShow();
        }, 200);
        rdpMicSetEnabled(true);
        if (micLive && micRate > 0) {
          document.getElementById('status').textContent =
            'Connected · микрофон активен (' + micRate + ' Гц)';
        }
      } catch (e) {
        document.getElementById('status').textContent =
          'Микрофон недоступен: ' + (e && e.message ? e.message : e);
        micStop();
      }
      micUpdateBtn();
    }

    function micStop() {
      // micArmed — локальный выключатель, micLive — состояние сервера
      // (audin OPEN). Здесь гасим только локальный: иначе после смены
      // устройства или выкл→вкл звук не вернётся до переподключения.
      micArmed = false;
      try {
        if (typeof rdpMicSetEnabled === 'function') rdpMicSetEnabled(false);
      } catch (_) {}
      try { if (micProc) micProc.disconnect(); } catch (_) {}
      try { if (micNode) { micNode.port.onmessage = null; micNode.disconnect(); } } catch (_) {}
      try { if (micNodeSrc) micNodeSrc.disconnect(); } catch (_) {}
      try { if (micSilent) micSilent.disconnect(); } catch (_) {}
      micProc = null;
      micNode = null;
      micNodeSrc = null;
      micSilent = null;
      if (micRateTimer) { clearInterval(micRateTimer); micRateTimer = null; }
      if (micWorkletURL) {
        try { URL.revokeObjectURL(micWorkletURL); } catch (_) {}
        micWorkletURL = null;
      }
      if (micStream) {
        try { micStream.getTracks().forEach(function (t) { t.stop(); }); } catch (_) {}
        micStream = null;
      }
      if (micCtx) {
        try { micCtx.close(); } catch (_) {}
        micCtx = null;
      }
      if (micLevelTimer) { clearInterval(micLevelTimer); micLevelTimer = null; }
      micPeak = 0;
      micLevelShow();
      micUpdateBtn();
    }

    // Server opened capture (or changed format): remember it; actual
    // pushing starts only when the user arms the mic (micToggle).
    function rdpOnMicOpen(rate, channels, framesPerPacket) {
      micRate = rate | 0;
      micCh = channels | 0;
      micFpp = framesPerPacket | 0;
      if (micNode) {
        try {
          micNode.port.postMessage({
            rate: micRate, outCh: micCh || 1, framesPerPacket: micFpp || 160,
          });
        } catch (_) {}
      }
      micLive = true;
      document.getElementById('status').textContent = micArmed ?
        'Connected · микрофон активен (' + micRate + ' Гц)' :
        'Connected · сервер включил микрофон — нажмите кнопку «Микрофон»';
      micUpdateBtn();
    }

    function rdpOnMicClose() {
      micLive = false;
      if (connected) document.getElementById('status').textContent = 'Connected';
      micUpdateBtn();
    }

    // Диагностика: где остановился обмен с сервером (dvc → version →
    // formats → open → data). Помогает понять, сервер не создал канал
    // или сломался разбор PDU.
    const MIC_STAGE_LABEL = {
      'req-sent': 'запрос канала отправлен',
      'dvccaps1': 'DVC v1',
      'dvccaps2': 'DVC v2',
      'dvccaps3': 'DVC v3',
      'req-ok': 'запрос ушёл',
      'req-fail': 'запрос НЕ ушёл (нет канала)',
      'rdpdr-ann': 'rdpdr: announce отвечен',
      'rdpdr-name': 'rdpdr: имя отправлено',
      'rdpdr-caps': 'rdpdr: capabilities отвечены',
      'rsp-ok': 'сервер подтвердил канал',
      'rsp-fail': 'сервер ОТКЛОНИЛ канал',
      dvc: 'канал создан',
      version: 'версия',
      formats: 'форматы',
      open: 'сервер открыл',
      formatchange: 'смена формата',
      data: 'идёт звук',
      worklet: 'браузер: захват через AudioWorklet (аудиопоток)',
      noworklet: 'браузер: фолбэк ScriptProcessor (нет AudioWorklet)',
      procfired: 'браузер: захват запущен',
      pk: 'пик сигнала (0 = тишина)',
      procblocked: 'браузер: захват запущен, но выключен кнопкой/каналом',
      capture: 'браузер: первый чанк отправлен',
      capmany: 'браузер: >100 чанков отправлено',
      push: 'сервер: первый чанк ушёл',
      pushmany: 'сервер: >100 чанков ушло'
    };
    // micLabel — человекочитаемое имя шага.
    function micLabel(s) {
      if (MIC_STAGE_LABEL[s]) return MIC_STAGE_LABEL[s];
      if (s.indexOf('rdpdr') === 0) return 'rdpdr: ' + MIC_STAGE_LABEL[s];
      if (s.indexOf('pdr') === 0) return 'rdpdr PDU 0x' + s.slice(3);
      if (s.indexOf("reqname") === 0) return "запрос канала: " + s.slice(7);
      if (s.indexOf("req") === 0) return "запрос канала #" + s.slice(3);
      if (s.indexOf('fmt') === 0) return 'формат от сервера: ' + s.slice(3);
      if (s.indexOf('fpp') === 0) return 'кадров в пакете (по OPEN): ' + s.slice(3);
      if (s.indexOf('srv') === 0) return 'формат из OPEN (сервер): ' + s.slice(3);
      if (s.indexOf('pk') === 0) return 'пик сигнала: ' + s.slice(2);
      if (s.indexOf('rate') === 0) return 'скорость отправки: ' + s.slice(4) + ' кБ/с (факт/норма)';
      if (s.indexOf('unk') === 0) return 'неизвестный ответ #' + s.slice(3);
      return s;
    }

    // micRenderDebug — одна строка на шаг и на канал: длинную диагностику
    // иначе невозможно выделить и скопировать (раньше была одна строка).
    function micRenderDebug() {
      const el = document.getElementById('micDebug');
      if (!el) return;
      if (!micApplyDiagVisibility()) return;
      const seen = (el.dataset.seen || '').split(',').filter(Boolean);
      const dvc = (el.dataset.dvc || '').split(',').filter(Boolean);
      let out = 'mic-request: ' + (window.rdpMicRequested ? 'да (INFO_AUDIOCAPTURE)' : 'нет') +
        '\nearly-flags: 0x' +
        (((window.rdpExtraFlags || 0) >>> 0).toString(16).padStart(4, '0')) +
        '\nmic:' + (seen.length ? '' : ' (шагов пока нет)');
      for (let i = 0; i < seen.length; i++) out += '\n  ' + micLabel(seen[i]);
      out += '\nканалы сервера (' + dvc.length + '):';
      for (let i = 0; i < dvc.length; i++) out += '\n  ' + dvc[i];
      el.textContent = out;
    }

    // micDiagOn — включена ли галочка «Диагностика» (по умолчанию выключена,
    // состояние хранится в cookie rdp_micdiag). Пока выключена — диагностика
    // не собирается и не показывается вообще.
    function micDiagOn() {
      const cb = document.getElementById('micDiag');
      return !!(cb && cb.checked);
    }

    // micApplyDiagVisibility — показать/скрыть все элементы диагностики.
    function micApplyDiagVisibility() {
      const on = micDiagOn();
      const el = document.getElementById('micDebug');
      const toggleBtn = document.getElementById('micToggleBtn');
      const copyBtn = document.getElementById('micCopyBtn');
      if (!on) {
        micDebugOpen = false;
        if (el) el.style.display = 'none';
        if (toggleBtn) toggleBtn.style.display = 'none';
        if (copyBtn) copyBtn.style.display = 'none';
        return false;
      }
      if (toggleBtn) toggleBtn.style.display = '';
      if (copyBtn) copyBtn.style.display = '';
      if (el) el.style.display = micDebugOpen ? '' : 'none';
      micToggleLabel();
      return true;
    }

    function micDiagChanged() {
      saveCookies();
      if (micApplyDiagVisibility()) micRenderDebug();
    }

    function micLastSuffix() {
      const el = document.getElementById('micDebug');
      const seen = ((el && el.dataset.seen) || '').split(',').filter(Boolean);
      return seen.length ? ' (последнее: ' + micLabel(seen[seen.length - 1]) + ')' : '';
    }

    function micToggleLabel() {
      const b = document.getElementById('micToggleBtn');
      if (!b) return;
      b.textContent = 'Диагностика микрофона ' + (micDebugOpen ? '▴' : '▾') + micLastSuffix();
    }

    function micToggleDebug() {
      const el = document.getElementById('micDebug');
      if (!el) return;
      micDebugOpen = !micDebugOpen;
      el.style.display = micDebugOpen ? '' : 'none';
      micToggleLabel();
    }

    // micCopyDebug — копирует ПОЛНУЮ диагностику (не то, что видно на
    // экране), поэтому работает независимо от прокрутки и размера окна.
    function micCopyDebug() {
      const el = document.getElementById('micDebug');
      const btn = document.getElementById('micCopyBtn');
      if (!el) return;
      const seen = (el.dataset.seen || '').split(',').filter(Boolean);
      const dvc = (el.dataset.dvc || '').split(',').filter(Boolean);
      let out = 'mic:';
      for (let i = 0; i < seen.length; i++) out += '\n  ' + micLabel(seen[i]);
      out += '\nканалы сервера (' + dvc.length + '):';
      for (let i = 0; i < dvc.length; i++) out += '\n  ' + dvc[i];

      function feedback(ok) {
        if (!btn) return;
        btn.textContent = ok ? 'Скопировано' : 'Не удалось — выделите текст вручную';
        setTimeout(function () { btn.textContent = 'Скопировать диагностику'; }, 2500);
      }
      function fallback() {
        try {
          const ta = document.createElement('textarea');
          ta.value = out;
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '0';
          ta.style.width = '100%';
          ta.style.height = '160px';
          ta.style.zIndex = '9999';
          ta.style.fontFamily = 'monospace';
          ta.style.fontSize = '12px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          feedback(ok);
        } catch (e) { feedback(false); }
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(out).then(function () { feedback(true); },
            function () { fallback(); });
        } else {
          fallback();
        }
      } catch (e) { fallback(); }
    }

    function rdpOnMicProgress(stage) {
      if (!micDiagOn()) return;
      const el = document.getElementById('micDebug');
      if (!el) return;
      const seen = (el.dataset.seen || '').split(',').filter(Boolean);
      if (seen.indexOf(stage) === -1) seen.push(stage);
      el.dataset.seen = seen.join(',');
      micRenderDebug();
    }

    // Диагностика: какие DVC-каналы запрашивает сервер. Если
    // AUDIO_INPUT тут нет — сервер вообще не инициирует аудиовход.
    function rdpOnDvc(name) {
      if (!micDiagOn()) return;
      const el = document.getElementById('micDebug');
      if (!el) return;
      const list = (el.dataset.dvc || '').split(',').filter(Boolean);
      if (list.indexOf(name) === -1) list.push(name);
      el.dataset.dvc = list.join(',');
      micRenderDebug();
    }

    let micProcCalls = 0;
    let micChunks = 0;
    let micPeak = 0;      // максимум |амплитуды| с момента включения
    let micPeakStage = 0; // сколько раз уже показывали пик
    function micProcess(ev) {
      // Диагностика: обработчик вообще вызывается?
      micProcCalls++;
      if (micProcCalls === 1) rdpOnMicProgress('procfired');
      if (!micArmed || !micLive || micRate <= 0 || micCh <= 0) {
        if (micProcCalls === 1) rdpOnMicProgress('procblocked');
        return;
      }
      try {
        const inBuf = ev.inputBuffer;
        const inRate = inBuf.sampleRate;
        const inCh = inBuf.numberOfChannels;
        const n = inBuf.length;
        if (n <= 0 || inCh <= 0) return;
        const outCh = micCh;
        // Per-buffer linear resample (edge sample duplicated at the tail;
        // a 1-sample joint is inaudible in voice, no cross-buffer state).
        const ratio = inRate / micRate;
        let frames = Math.ceil(n / ratio);
        if (frames > 8192) frames = 8192;
        const pcm = new Int16Array(frames * outCh);
        for (let j = 0; j < frames; j++) {
          const p = j * ratio;
          let i0 = Math.floor(p);
          if (i0 > n - 1) i0 = n - 1;
          const i1 = (i0 + 1 > n - 1) ? n - 1 : i0 + 1;
          const f = p - Math.floor(p);
          for (let c = 0; c < outCh; c++) {
            const srcCh = (c < inCh) ? c : 0;
            const data = inBuf.getChannelData(srcCh);
            let v = data[i0] + (data[i1] - data[i0]) * f;
            if (v > 1) v = 1; else if (v < -1) v = -1;
            const s16 = Math.round(v * 32767);
            const a = s16 < 0 ? -s16 : s16;
            if (a > micPeak) micPeak = a;
            pcm[j * outCh + c] = s16;
          }
        }
        if (typeof rdpMicPush === 'function') {
          rdpMicPush(new Uint8Array(pcm.buffer, 0, frames * outCh * 2));
          micChunks++;
          if (micChunks === 1) rdpOnMicProgress('capture');
          else if (micChunks === 100) rdpOnMicProgress('capmany');
          // Пик сигнала: если он нулевой — захватывается тишина.
          if (micChunks === 1 || micChunks - micPeakStage >= 100) {
            micPeakStage = micChunks;
            rdpOnMicProgress('pk' + micPeak);
          }
        }
      } catch (_) { /* drop chunk on transient errors */ }
    }

    // ── WebCodecs H.264 decoder ───────────────────────────────────────────────
    // h264Dec is created fresh on each RDP connection and torn down on
    // disconnect.  Frames are drawn directly onto rdpCanvas via drawImage().
    let h264Dec = null;
    let h264Timestamp = 0; // monotonically increasing μs counter
    let h264Codec = null;  // actual codec string sent to VideoDecoder
    let h264SeenKey = false; // have we fed the decoder a keyframe yet?

    // Pending frame position keyed by timestamp (μs).
    const h264FramePos = new Map();

    // ── Frame counter / FPS display ───────────────────────────────────────────
    let frameCount = 0;      // frames rendered since last update
    let fpsTickTimer = null;

    function rdpFrameTick() {
      if (!connected) return;
      frameCount++;
    }

    // Update the FPS readout every 500 ms while connected.
    function fpsTicker() {
      if (!connected) {
        const st = document.getElementById("status");
        if (st && st.textContent.indexOf("fps") !== -1) return; // leave terminal state
        clearInterval(fpsTickTimer); fpsTickTimer = null; return;
      }
      const fps = Math.round(frameCount * (1000 / 500));
      frameCount = 0;
      const st = document.getElementById("status");
      if (st) {
        const base = h264Dec ? "Connected (WebCodecs H.264)" : "Connected";
        st.textContent = base + " \u2014 " + fps + " fps";
      }
      const mf = document.getElementById("miniFps");
      if (mf) mf.textContent = fps + " fps";
    }

    function fpsStop() {
      if (fpsTickTimer) { clearInterval(fpsTickTimer); fpsTickTimer = null; }
      frameCount = 0;
      if (!document.getElementById("status")) return;
      const st = document.getElementById("status");
      if (st && st.textContent.indexOf("fps") !== -1) {
        st.textContent = h264Dec ? "Connected (WebCodecs H.264)" : "Connected";
      }
      const mf = document.getElementById("miniFps");
      if (mf) mf.textContent = "";
    }

    // ── Ping / задержка до RDP-хоста ────────────────────────────────────────
    // Прокси (grdp-proxy) отдаёт TCP RTT до target на /ping?target=host:port.
    // Опрашиваем каждые 2 с, пока подключено, и показываем в островке.
    let pingTimer = null;
    let lastPingMs = -1;

    // Версия клиента для антикэш-параметра в пинге страницы.
    const CLIENT_VERSION = 70;

    function pingPage() {
      // Пинг от клиента до страницы RDP (браузер → роутер/панель).
      // Замеряем RTT простым GET к самому клиенту с таймингом.
      if (!connected) return;
      const t0 = performance.now();
      fetch("/rdp/?v=" + CLIENT_VERSION + "&_=" + Date.now(), { cache: "no-store", mode: "same-origin" })
        .then(function(r) {
          if (!r.ok) throw new Error("http " + r.status);
          const ms = Math.round(performance.now() - t0);
          const el = document.getElementById("miniPagePing");
          if (el) el.textContent = "панель: " + ms + " мс";
        })
        .catch(function() {
          const el = document.getElementById("miniPagePing");
          if (el) el.textContent = "";
        });
    }

    function pingOnce() {
      if (!connected) return;
      const hostEl = document.getElementById("host");
      const portEl = document.getElementById("port");
      if (!hostEl || !hostEl.value.trim()) { return; }
      const target = hostEl.value.trim() + ":" + ((portEl && portEl.value.trim()) || "3389");
      fetch("/rdp/ping?target=" + encodeURIComponent(target), { cache: "no-store" })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (!connected) return;
          const ms = (typeof d.ms === "number") ? d.ms : -1;
          lastPingMs = ms;
          const el = document.getElementById("miniPing");
          if (el) el.textContent = (ms >= 0) ? ("RDP: " + ms + " мс") : "";
        })
        .catch(function() {});
    }

    function pingStart() {
      pingStop();
      pingOnce();
      pingPage();
      pingTimer = setInterval(function() { pingOnce(); pingPage(); }, 2000);
    }

    function pingStop() {
      if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
      const el = document.getElementById("miniPing");
      if (el) el.textContent = "";
      const pel = document.getElementById("miniPagePing");
      if (pel) pel.textContent = "";
    }

    function h264Supported() {
      return (typeof VideoDecoder !== 'undefined') &&
             (typeof EncodedVideoChunk !== 'undefined');
    }

    // Extract the (first) SPS NAL from an Annex-B stream and build the
    // matching avc1 codec string. Returns null if no SPS is present.
    // Format: avc1.<profile_idc><constraint><level>, two hex digits each,
    // per RFC 6381 (constraint_flags derived from constraint_set0..2).
    function h264CodecFromSps(uint8Data) {
      const arr = (uint8Data instanceof Uint8Array) ? uint8Data : new Uint8Array(uint8Data);
      for (let i = 0; i + 4 < arr.length; i++) {
        if (arr[i] === 0 && arr[i + 1] === 0 && arr[i + 2] === 1) {
          const nalType = arr[i + 3] & 0x1f;
          if (nalType === 7 && i + 8 < arr.length) { // SPS
            const profile = arr[i + 4];
            const constraint = arr[i + 5];
            const level = arr[i + 6];
            const cc = ((constraint >> 5) & 0x07) << 3;
            const hex = (v) => ('0' + v.toString(16)).slice(-2);
            return 'avc1.' + hex(profile) + hex(cc) + hex(level);
          }
        }
      }
      return null;
    }

    function createH264Decoder(width, height, codec) {
      if (!h264Supported()) return null;
      const decoder = new VideoDecoder({
        output(frame) {
          if (!connected) { frame.close(); return; }
          const pos = h264FramePos.get(frame.timestamp);
          h264FramePos.delete(frame.timestamp);
          const x = pos ? pos.x : 0;
          const y = pos ? pos.y : 0;
          ctx2d.drawImage(frame, x, y);
          frame.close();
          rdpFrameTick();
        },
        error(e) {
          console.warn('WebCodecs H.264 decoder error:', e);
          // Reset decoder; drop pending frames so a fresh IDR is requested.
          h264SeenKey = false;
          h264FramePos.clear();
        }
      });
      try {
        decoder.configure({
          codec: codec || 'avc1.42E01F', // Baseline level 3.1 fallback
          codedWidth: width,
          codedHeight: height,
          optimizeForLatency: true,
        });
      } catch (e) {
        console.warn('configure() failed:', e);
        h264SeenKey = false;
        return null;
      }
      h264Codec = codec || 'avc1.42E01F';
      h264SeenKey = false;
      return decoder;
    }

    // Called from Go/WASM with raw H.264 NAL unit data (AVC420 only).
    function rdpOnH264(destX, destY, w, h, isKey, uint8Data) {
      if (!h264Dec || h264Dec.state === 'closed') return;
      // Determine/re-evaluate codec from SPS. The first keyframe of each
      // stream carries SPS/PPS; use its profile/level, not a hardcoded one.
      const sps = h264CodecFromSps(uint8Data);
      if (sps && sps !== h264Codec) {
        try {
          h264Dec.configure({
            codec: sps, codedWidth: w, codedHeight: h, optimizeForLatency: true
          });
        } catch (e) {
          console.warn('reconfigure ' + sps + ' failed:', e);
        }
        h264Codec = sps;
      }
      // WebCodecs cannot decode a delta frame before a keyframe. Drop
      // everything until the first IDR of the current stream.
      if (!h264SeenKey && !isKey) return;
      if (isKey) h264SeenKey = true;

      // One complete coded frame in a single chunk (grdp hands us whole
      // AVC420 pictures). Timestamps go up by 1ms per frame.
      h264Timestamp += 1000;
      h264FramePos.set(h264Timestamp, { x: destX, y: destY });
      try {
        h264Dec.decode(new EncodedVideoChunk({
          type: isKey ? 'key' : 'delta',
          timestamp: h264Timestamp,
          data: uint8Data,
        }));
      } catch (e) {
        console.warn('rdpOnH264 decode error:', e);
      }
    }

    // ── Canvas / ctx2d ────────────────────────────────────────────────────────
    const canvas = document.getElementById('rdpCanvas');
    let ctx2d = canvas.getContext('2d');

    // ── Server-side mouse pointer ─────────────────────────────────────────────
    // The RDP server sends pointer shapes (with hotspots) and cache references.
    // We rasterise each shape to a PNG data URL once and apply it as the
    // canvas's CSS cursor; the browser composites it natively at the local
    // mouse position.  Pointer shapes are cached by server-assigned index;
    // pointer_cached PDUs just re-select an already-rendered shape.
    const pointerCache = new Map(); // idx → CSS cursor value

    function rdpOnPointerHide() {
      // «Всегда показывать локальный курсор» (cookie rdp_always_cursor /
      // query-параметр alwaysCursor): полностью игнорируем серверные формы
      // и всегда показываем локальную стрелку. Серверный курсор в RDP часто
      // белый без чёрной обводки — на светлом фоне он невидим.
      canvas.style.cursor = alwaysCursorOn() ? 'default' : 'none';
    }

    function rdpOnPointerCached(idx) {
      if (alwaysCursorOn()) {
        canvas.style.cursor = 'default';
        return;
      }
      const css = pointerCache.get(idx);
      if (css) canvas.style.cursor = css;
    }

    function rdpOnPointerUpdate(idx, xorBpp, hotX, hotY, w, h, andMask, xorData) {
      if (alwaysCursorOn()) {
        canvas.style.cursor = 'default';
        return;
      }
      const css = buildCursorCss(xorBpp, hotX, hotY, w, h, andMask, xorData);
      if (!css) return;
      pointerCache.set(idx, css);
      canvas.style.cursor = css;
    }

    // alwaysCursorOn — включена ли опция «всегда показывать локальный курсор».
    // Источники по приоритету: чекбокс #alwaysCursor в панели клиента →
    // query-параметр alwaysCursor=1 (старые URL) → cookie rdp_always_cursor.
    function alwaysCursorOn() {
      const cb = document.getElementById('alwaysCursor');
      if (cb) return cb.checked;
      if (getQueryParam('alwaysCursor') === '1') return true;
      return getCookie('rdp_always_cursor') === '1';
    }

    function getQueryParam(key) {
      var q = window.location.search;
      if (!q) return '';
      var params = q.slice(1).split('&');
      for (var i = 0; i < params.length; i++) {
        var kv = params[i].split('=');
        if (kv[0] === key) return decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
      }
      return '';
    }

    // buildCursorCss rasterises an MS-RDPBCGR pointer (§2.2.9.1.1.4.4) into a
    // CSS `url(...) hotX hotY, default` cursor value.  AND/XOR mask data
    // arrives top-down (grdp flips it server-side).
    function buildCursorCss(xorBpp, hotX, hotY, w, h, andMask, xorData) {
      if (w <= 0 || h <= 0) return null;
      const off = ('OffscreenCanvas' in window)
        ? new OffscreenCanvas(w, h)
        : Object.assign(document.createElement('canvas'), { width: w, height: h });
      const octx = off.getContext('2d');
      const img = octx.createImageData(w, h);
      const px = img.data;

      // AND mask: 1bpp, padded to 2-byte stride per scanline.
      const andStride = (((w + 15) >> 4) << 1);
      const andBit = (x, y) => {
        const off = y * andStride + (x >> 3);
        if (off >= andMask.length) return 1; // missing → transparent
        return (andMask[off] >> (7 - (x & 7))) & 1;
      };

      if (xorBpp === 1) {
        // Monochrome: XOR mask is 1bpp, same stride rules as AND.
        const xorStride = andStride;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const a = andBit(x, y);
            const xo = xorStride * y + (x >> 3);
            const xb = xo < xorData.length
              ? (xorData[xo] >> (7 - (x & 7))) & 1
              : 0;
            const o = (y * w + x) << 2;
            // (AND, XOR): 00 black, 01 white, 10 transparent, 11 invert→black.
            if (a === 0 && xb === 0)      { px[o]=0;   px[o+1]=0;   px[o+2]=0;   px[o+3]=255; }
            else if (a === 0 && xb === 1) { px[o]=255; px[o+1]=255; px[o+2]=255; px[o+3]=255; }
            else if (a === 1 && xb === 0) { px[o]=0;   px[o+1]=0;   px[o+2]=0;   px[o+3]=0;   }
            else                          { px[o]=0;   px[o+1]=0;   px[o+2]=0;   px[o+3]=255; }
          }
        }
      } else if (xorBpp === 32) {
        // BGRA32, alpha takes precedence over AND mask (modern Windows path).
        const stride = w * 4;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const s = y * stride + x * 4;
            const o = (y * w + x) << 2;
            if (s + 3 >= xorData.length) {
              px[o]=0; px[o+1]=0; px[o+2]=0; px[o+3]=0;
              continue;
            }
            const b = xorData[s], g = xorData[s+1], r = xorData[s+2], a = xorData[s+3];
            if (a !== 0) {
              px[o]=r; px[o+1]=g; px[o+2]=b; px[o+3]=a;
            } else if (andBit(x, y) === 0) {
              // AND=0 with alpha=0 means opaque-color-but-no-alpha-channel
              // (some servers leave alpha as 0); fall back to AND mask.
              px[o]=r; px[o+1]=g; px[o+2]=b; px[o+3]=255;
            } else {
              px[o]=0; px[o+1]=0; px[o+2]=0; px[o+3]=0;
            }
          }
        }
      } else if (xorBpp === 24) {
        // BGR24, AND mask provides transparency. Stride padded to 2 bytes
        // per grdp's flip (matches xorStride = ((w*24 + 15)/16)*2 = w*3 padded).
        const stride = ((w * 3 + 1) >> 1) << 1;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const s = y * stride + x * 3;
            const o = (y * w + x) << 2;
            if (s + 2 >= xorData.length) {
              px[o]=0; px[o+1]=0; px[o+2]=0; px[o+3]=0;
              continue;
            }
            if (andBit(x, y) === 0) {
              px[o]=xorData[s+2]; px[o+1]=xorData[s+1]; px[o+2]=xorData[s]; px[o+3]=255;
            } else {
              px[o]=0; px[o+1]=0; px[o+2]=0; px[o+3]=0;
            }
          }
        }
      } else {
        // Unsupported depth (15/16bpp etc.): don't apply a transparent cursor
        // (invisible). Return null so the caller keeps/falls back to a visible
        // cursor instead of hiding the pointer entirely.
        console.warn('Unsupported cursor xorBpp:', xorBpp);
        return null;
      }

      octx.putImageData(img, 0, 0);
      // OffscreenCanvas doesn't expose toDataURL; copy through a regular canvas.
      let dataUrl;
      if (off instanceof HTMLCanvasElement) {
        dataUrl = off.toDataURL('image/png');
      } else {
        const tmp = document.createElement('canvas');
        tmp.width = w; tmp.height = h;
        tmp.getContext('2d').drawImage(off, 0, 0);
        dataUrl = tmp.toDataURL('image/png');
      }
      // Clamp hotspot to bitmap bounds — some servers ship out-of-range values.
      const hx = Math.max(0, Math.min(w - 1, hotX|0));
      const hy = Math.max(0, Math.min(h - 1, hotY|0));
      return `url("${dataUrl}") ${hx} ${hy}, default`;
    }

    // ── WASM bootstrap ────────────────────────────────────────────────────────
    // main.wasm кешируется агрессивно: версия в query обязательна,
    // иначе браузер молча крутит старый билд без нового API (как было с микрофоном).
    WebAssembly.instantiateStreaming(fetch("main.wasm?v=" + CLIENT_VERSION), go.importObject).then(result => {
      go.run(result.instance);
      document.getElementById("status").textContent = "Ready";
      micUpdateBtn();
      micApplyDiagVisibility();
      micRefreshDevices();
    }).catch(e => {
      document.getElementById("status").textContent = "WASM load failed: " + e;
    });

    function proxyURL() {
      return (location.protocol === "https:" ? "wss://" : "ws://") + location.host;
    }

    function toggleConnect() {
      if (connected) {
        rdpDisconnect();
        setDisconnected("Disconnected");
      } else {
        doConnect();
      }
    }

    async function doConnect() {
      const host     = document.getElementById("host").value.trim();
      const port     = document.getElementById("port").value.trim();
      const domain   = document.getElementById("domain").value.trim();
      const user     = document.getElementById("user").value.trim();
      const password = document.getElementById("password").value;
      const width    = parseInt(document.getElementById("width").value) || 1280;
      const height   = parseInt(document.getElementById("height").value) || 800;

      saveCookies();
      rememberHost(host);

      // (Re)create the H.264 decoder sized for this session.
      if (h264Dec) { try { h264Dec.close(); } catch (_) {} }
      // VideoDecoder may exist but lack H.264 (e.g. Android HW). Probe the
      // actual codec support and only then decide whether to advertise AVC.
      let webCodecsOk = h264Supported();
      if (webCodecsOk && typeof VideoDecoder.isConfigSupported === 'function') {
        try {
          const probe = await VideoDecoder.isConfigSupported(
            { codec: 'avc1.42001F', codedWidth: width, codedHeight: height });
          webCodecsOk = probe && probe.supported === true;
        } catch (_) { webCodecsOk = false; }
      }
      // Ручное отключение H.264 (чекбокс «Битмапы»): сервер шлёт RemoteFX/NSCodec.
      // Кадры самодостаточны — стабильнее через медленные/буферизующие каналы.
      if (document.getElementById('noH264').checked) webCodecsOk = false;
      // Tell the Go side up-front: without WebCodecs we must NOT advertise
      // AVC/H.264, otherwise the server sends H.264 frames nobody decodes.
      window.noWebCodecs = !webCodecsOk;
      h264Dec = webCodecsOk ? createH264Decoder(width, height) : null;
      h264Timestamp = 0;
      h264FramePos.clear();
      h264SeenKey = false;

      // Reset cursor state for the new session.
      pointerCache.clear();
      canvas.style.cursor = 'default';

      // Create AudioContext here, while we're in a user-gesture handler,
      // so the browser starts it in 'running' state (no autoplay suspension).
      if (audioCtx) { try { audioCtx.close(); } catch (_) {} }
      audioCtx = new AudioContext({ latencyHint: 'playback' });
      audioNextAt = 0;
      if (h264Dec) {
        document.getElementById("status").textContent = "Connecting… (WebCodecs H.264 enabled)";
      } else {
        document.getElementById("status").textContent = "Connecting… (WebCodecs unavailable)";
      }
      const qdEl = document.getElementById("queueDepth");
      const queueDepth = qdEl ? (parseInt(qdEl.value, 10) || 0) : 0;
      // Запрос микрофона у сервера (INFO_AUDIOCAPTURE) — только при подключении.
      const micReqEl = document.getElementById("micRequest");
      window.rdpMicRequested = !!(micReqEl && micReqEl.checked);
      rdpConnect(proxyURL(), host, port, domain, user, password, width, height,
        document.getElementById("swapAltMeta").checked, queueDepth);
    }

    // Callbacks from WASM
    function rdpOnReady() {
      connected = true;
      const btn = document.getElementById("connectBtn");
      btn.textContent = "Disconnect";
      btn.classList.add("connected");
      document.getElementById("status").textContent =
        h264Dec ? "Connected (WebCodecs H.264)" : "Connected";
      const pb = document.getElementById("rdpPasteBridge");
      if (pb) pb.focus();
      if (fpsTickTimer) clearInterval(fpsTickTimer);
      frameCount = 0;
      fpsTickTimer = setInterval(fpsTicker, 500);
      pingStart();
      // Если микрофон включили до подключения, клиент тогда ещё не
      // существовал (вызов был no-op) — повторяем арм на новой сессии.
      if (micArmed && typeof rdpMicSetEnabled === 'function') {
        try { rdpMicSetEnabled(true); } catch (_) {}
      }
      micUpdateBtn();
      everConnected = true;
      updateMiniConn();
    }

    function rdpOnError(msg) {
      setDisconnected("Ошибка: " + humanizeRdpError(msg));
      const st = document.getElementById("status");
      if (st) st.title = String(msg || '');   // исходный текст — в подсказке
    }

    function rdpOnClose() {
      setDisconnected("Сессия закрыта");
    }

    // Server → client: write text to browser clipboard (text only).
    // Clipboard API работает только в secure context (HTTPS/localhost).
    // По HTTP по LAN navigator.clipboard undefined — используем fallback
    // через document.execCommand('copy') с hidden textarea.
    function clipboardWrite(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(err => {
          console.warn("clipboard.writeText failed, fallback:", err);
          legacyClipboardWrite(text);
        });
      }
      legacyClipboardWrite(text);
    }

    function legacyClipboardWrite(text) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (!ok) console.warn("legacy clipboard copy failed");
      } catch (e) {
        console.warn("legacy clipboard copy error:", e);
      }
    }

    function rdpOnClipboard(text) {
      clipboardWrite(text);
    }

    function setDisconnected(msg) {
      connected = false;
      fpsStop();
      pingStop();
      // Сессии больше нет — потребитель захвата пропал: гасим микрофон
      // полностью (индикатор ОС гаснет). Для новой сессии — один клик
      // по кнопке (разрешение origin уже выдано, повторного запроса не будет).
      micStop();
      micLive = false;   // серверный канал умер вместе с сессией
      micRate = 0;
      micCh = 0;
      micFpp = 0;
      if (audioCtx) { try { audioCtx.close(); } catch (_) {} audioCtx = null; audioNextAt = 0; }
      if (h264Dec) { try { h264Dec.close(); } catch (_) {} h264Dec = null; }
      h264FramePos.clear();
      const btn = document.getElementById("connectBtn");
      btn.textContent = "Connect";
      btn.classList.remove("connected");
      document.getElementById("status").textContent = msg;
      updateMiniConn();
    }

    // ── Вписать в окно / полный экран ────────────────────────────────────────
    // В режиме «Вписать» canvas масштабируется CSS-ом, поэтому координаты
    // мыши пересчитываются из CSS-размера в пиксели буфера (canvasXY).
    function fitOn() {
      const w = document.getElementById('canvasWrapper');
      return !!(w && w.classList.contains('fit'));
    }

    function applyFit(on) {
      const w = document.getElementById('canvasWrapper');
      const b = document.getElementById('fitBtn');
      if (w) w.classList.toggle('fit', on);
      if (b) b.classList.toggle('on', on);
      setCookie('rdp_fit', on ? '1' : '0');
    }

    function toggleFit() { applyFit(!fitOn()); }

    function canvasXY(e) {
      const r = canvas.getBoundingClientRect();
      const sx = r.width ? canvas.width / r.width : 1;
      const sy = r.height ? canvas.height / r.height : 1;
      return {
        x: Math.floor((e.clientX - r.left) * sx),
        y: Math.floor((e.clientY - r.top) * sy)
      };
    }

    function toggleFullscreen() {
      try {
        const el = document.documentElement;
        const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
        if (fsEl) {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          return;
        }
        if (el.requestFullscreen) {
          const p = el.requestFullscreen();
          if (p && p.catch) p.catch(function () {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      } catch (_) {}
    }

    // Mouse / keyboard events
    canvas.addEventListener("mousemove", e => {
      if (!connected) return;
      const p = canvasXY(e);
      rdpMouseMove(p.x, p.y);
    });

    canvas.addEventListener("mousedown", e => {
      if (!connected) return;
      e.preventDefault();
      const p = canvasXY(e);
      // grdp button: 0=left, 1=middle, 2=right  (JS: 0=left, 1=middle, 2=right)
      rdpMouseDown(e.button, p.x, p.y);
    });

    canvas.addEventListener("mouseup", e => {
      if (!connected) return;
      e.preventDefault();
      const p = canvasXY(e);
      rdpMouseUp(e.button, p.x, p.y);
    });

    canvas.addEventListener("wheel", e => {
      if (!connected) return;
      e.preventDefault();
      // Normalize browser deltaY to notch count (1.0 = one physical notch).
      // grdp's MouseWheel(delta) expects notch units and handles WHEEL_DELTA scaling.
      // Browser deltaY is positive when scrolling down; RDP wheel is positive for up.
      let delta;
      if (e.deltaMode === 1) {        // DOM_DELTA_LINE: ~3 lines per notch
        delta = -e.deltaY / 3;
      } else if (e.deltaMode === 2) { // DOM_DELTA_PAGE
        delta = -e.deltaY;
      } else {                        // DOM_DELTA_PIXEL: ~100 px per notch
        delta = -e.deltaY / 100;
      }
      rdpMouseWheel(delta);
    }, { passive: false });

    canvas.addEventListener("contextmenu", e => e.preventDefault());

    // Track the in-flight clipboard read so keydown can wait for it to finish.
    let clipboardSyncPromise = Promise.resolve();

    // Чтение локального клипборда. Clipboard API (readText) требует secure
    // context — по HTTP по LAN недоступен, поэтому основной путь — событие
    // paste (e.clipboardData работает по HTTP) на скрытой textarea.
    // readText пробуем как bonus (HTTPS).
    function syncClipboard() {
      if (!connected) return;
      if (navigator.clipboard && navigator.clipboard.readText) {
        const readPromise = navigator.clipboard.readText()
          .then(text => { if (text) rdpClipboardChanged(text); })
          .catch(err => {
            if (err && err.name === "NotAllowedError") {
              console.warn("clipboard-read denied (iframe allow=?", err.message);
            } else {
              console.warn("clipboard read failed:", err);
            }
          });
        clipboardSyncPromise = Promise.race([
          readPromise,
          new Promise(res => setTimeout(res, 1500))
        ]);
      }
    }

    // Скрытая textarea — постоянная точка фокуса (как helper-textarea xterm.js):
    // на ней ловим нативный paste (работает по HTTP, e.clipboardData не требует
    // secure context) и клавиши, которые перенаправляем в RDP.
    const pasteBridge = document.getElementById("rdpPasteBridge");
    if (pasteBridge) {
      pasteBridge.addEventListener("paste", e => {
        if (!connected) return;
        e.preventDefault();
        const text = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
        pasteBridge.value = "";
        if (text) {
          rdpClipboardChanged(text);
          // Ctrl физически ещё нажат — шлём V, чтобы Windows вставила.
          rdpKeyDown("KeyV");
          setTimeout(() => { if (connected) rdpKeyUp("KeyV"); }, 50);
        }
      });

      pasteBridge.addEventListener("keydown", async e => {
        if (!connected) return;
        if ((e.ctrlKey || e.metaKey) && (e.code === "KeyV")) {
          if (navigator.clipboard && navigator.clipboard.readText) {
            e.preventDefault();
            syncClipboard();
            await clipboardSyncPromise;
            rdpKeyDown("KeyV");
            setTimeout(() => { if (connected) rdpKeyUp("KeyV"); }, 50);
          }
          // HTTP: НЕ preventDefault — браузер сгенерирует нативный paste на textarea.
          return;
        }
        e.preventDefault();
        rdpKeyDown(e.code);
      });

      pasteBridge.addEventListener("keyup", e => {
        if (!connected) return;
        if ((e.ctrlKey || e.metaKey) && (e.code === "KeyV")) return;
        e.preventDefault();
        rdpKeyUp(e.code);
      });
    }

    // Sync on click: covers the common case of copying in another app then
    // clicking back into the canvas before pressing the paste key.
    // Возвращаем фокус на скрытую textarea, чтобы следующее Ctrl+V пришло на неё.
    canvas.addEventListener("pointerdown", () => {
      syncClipboard();
      if (pasteBridge) pasteBridge.focus();
    });

    // Sync via paste event (Cmd+V on macOS, right-click paste, etc.).
    // e.clipboardData работает и по HTTP (не требует secure context).
    function handlePaste(e) {
      if (!connected) return;
      const text = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
      if (text) rdpClipboardChanged(text);
    }
    document.addEventListener("paste", handlePaste);
  </script>
</body>
</html>
