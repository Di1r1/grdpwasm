<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>grdpwasm — Web RDP Client</title>
  <style>
    /* Fallback-переменные темы панели Entware Manager (светлая) — применяются,
       когда клиент открыт отдельно (новая вкладка). В iframe тема синхронизируется
       из родительского документа скриптом ниже. */
    :root {
      --bg-gradient: linear-gradient(135deg, #fefce8 0%, #fef3c7 100%);
      --app-bg: #f8fafc;
      --app-border: #e2e8f0;
      --sidebar-bg: #ffffff;
      --sidebar-border: #e2e8f0;
      --content-bg: #f8fafc;
      --text-primary: #1a202c;
      --text-secondary: #4a5568;
      --text-muted: #718096;
      --accent: #8b5cf6;
      --accent-dark: #6d28d9;
      --accent-rgb: 139, 92, 246;
      --accent-gradient: linear-gradient(135deg, #8b5cf6, #6d28d9);
      --accent-soft: rgba(var(--accent-rgb), 0.1);
      --accent-glow: rgba(var(--accent-rgb), 0.25);
      --table-header-bg: linear-gradient(135deg, #6d28d9, #5b21b6);
      --btn-gradient: linear-gradient(135deg, #7c3aed, #6d28d9);
      --border-color: #e2e8f0;
      --table-bg: #ffffff;
      --table-row-even: #f8fafc;
      --table-row-hover: #f1f5f9;
      --input-bg: #ffffff;
      --input-border: #e2e8f0;
      --input-focus: #8b5cf6;
      --modal-bg: #ffffff;
      --pre-bg: #f4f4f4;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
      --progress-bg: #edf2f7;
      --command-block-bg: #f1f5f9;
      --note-border: #f59e0b;
      --btn-bg: var(--btn-gradient);
      --btn-text: #ffffff;
      --btn-shadow: 0 4px 6px -1px rgba(var(--accent-rgb), 0.25);
      --btn-hover-shadow: 0 10px 15px -3px rgba(var(--accent-rgb), 0.35);
      --btn-disabled-opacity: 0.6;
      --btn-success: #27ae60;
      --btn-danger: #e74c3c;
      --btn-muted: #4a5568;
      --scrollbar-thumb: #cbd5e0;
      --scrollbar-track: #f1f5f9;
    }
    html.night {
      --bg-gradient: linear-gradient(135deg, #1a202c, #2d3748);
      --app-bg: rgba(26, 32, 44, 0.95);
      --app-border: rgba(74, 85, 104, 0.6);
      --sidebar-bg: rgba(26, 32, 44, 0.9);
      --sidebar-border: rgba(74, 85, 104, 0.6);
      --content-bg: rgba(26, 32, 44, 0.8);
      --text-primary: #e2e8f0;
      --text-secondary: #cbd5e0;
      --text-muted: #a0aec0;
      --accent: #8b5cf6;
      --accent-dark: #6d28d9;
      --accent-rgb: 139, 92, 246;
      --accent-gradient: linear-gradient(135deg, #c4b5fd, #8b5cf6);
      --accent-soft: rgba(var(--accent-rgb), 0.2);
      --accent-glow: rgba(var(--accent-rgb), 0.4);
      --table-header-bg: linear-gradient(135deg, #5b21b6, #4c1d95);
      --btn-gradient: linear-gradient(135deg, #6d28d9, #5b21b6);
      --border-color: #4a5568;
      --table-bg: #2d3748;
      --table-row-even: #374151;
      --table-row-hover: #4a5568;
      --input-bg: #4a5568;
      --input-border: #2d3748;
      --input-focus: #8b5cf6;
      --modal-bg: #2d3748;
      --pre-bg: #1a202c;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --progress-bg: #4a5568;
      --command-block-bg: #2d3748;
      --note-border: #f59e0b;
      --btn-bg: var(--btn-gradient);
      --btn-text: #ffffff;
      --btn-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
      --btn-hover-shadow: 0 10px 15px -3px rgba(var(--accent-rgb), 0.5);
      --btn-disabled-opacity: 0.5;
      --btn-success: #27ae60;
      --btn-danger: #e74c3c;
      --btn-muted: #718096;
      --scrollbar-thumb: #4a5568;
      --scrollbar-track: #2d3748;
    }
    /* Пресеты темы — повторяют style.css панели (акценты + градиенты кнопок) */
    [data-theme="ocean"] {
      --accent: #0ea5e9; --accent-dark: #0369a1; --accent-rgb: 14, 165, 233;
      --accent-gradient: linear-gradient(135deg, #38bdf8, #0284c7);
      --table-header-bg: linear-gradient(135deg, #0284c7, #0369a1);
      --btn-gradient: linear-gradient(135deg, #0284c7, #0369a1);
      --input-focus: #0ea5e9;
    }
    [data-theme="forest"] {
      --accent: #10b981; --accent-dark: #047857; --accent-rgb: 16, 185, 129;
      --accent-gradient: linear-gradient(135deg, #34d399, #059669);
      --table-header-bg: linear-gradient(135deg, #059669, #047857);
      --btn-gradient: linear-gradient(135deg, #059669, #047857);
      --input-focus: #10b981;
    }
    [data-theme="teal"] {
      --accent: #14b8a6; --accent-dark: #0f766e; --accent-rgb: 20, 184, 166;
      --accent-gradient: linear-gradient(135deg, #2dd4bf, #0d9488);
      --table-header-bg: linear-gradient(135deg, #0d9488, #0f766e);
      --btn-gradient: linear-gradient(135deg, #0d9488, #0f766e);
      --input-focus: #14b8a6;
    }
    [data-theme="amber"] {
      --accent: #f59e0b; --accent-dark: #b45309; --accent-rgb: 245, 158, 11;
      --accent-gradient: linear-gradient(135deg, #fbbf24, #d97706);
      --table-header-bg: linear-gradient(135deg, #d97706, #b45309);
      --btn-gradient: linear-gradient(135deg, #d97706, #b45309);
      --input-focus: #f59e0b;
    }
    [data-theme="ruby"] {
      --accent: #ef4444; --accent-dark: #b91c1c; --accent-rgb: 239, 68, 68;
      --accent-gradient: linear-gradient(135deg, #f87171, #dc2626);
      --table-header-bg: linear-gradient(135deg, #dc2626, #b91c1c);
      --btn-gradient: linear-gradient(135deg, #dc2626, #b91c1c);
      --input-focus: #ef4444;
    }
    [data-theme="rose"] {
      --accent: #ec4899; --accent-dark: #be185d; --accent-rgb: 236, 72, 153;
      --accent-gradient: linear-gradient(135deg, #f472b6, #db2777);
      --table-header-bg: linear-gradient(135deg, #db2777, #be185d);
      --btn-gradient: linear-gradient(135deg, #db2777, #be185d);
      --input-focus: #ec4899;
    }
    html.night[data-theme="ocean"] {
      --accent: #38bdf8; --accent-dark: #0284c7; --accent-rgb: 56, 189, 248;
      --accent-gradient: linear-gradient(135deg, #7dd3fc, #38bdf8);
      --table-header-bg: linear-gradient(135deg, #0369a1, #075985);
      --btn-gradient: linear-gradient(135deg, #0284c7, #0369a1);
      --input-focus: #38bdf8;
    }
    html.night[data-theme="forest"] {
      --accent: #34d399; --accent-dark: #059669; --accent-rgb: 52, 211, 153;
      --accent-gradient: linear-gradient(135deg, #6ee7b7, #34d399);
      --table-header-bg: linear-gradient(135deg, #047857, #065f46);
      --btn-gradient: linear-gradient(135deg, #059669, #047857);
      --input-focus: #34d399;
    }
    html.night[data-theme="teal"] {
      --accent: #2dd4bf; --accent-dark: #0d9488; --accent-rgb: 45, 212, 191;
      --accent-gradient: linear-gradient(135deg, #5eead4, #2dd4bf);
      --table-header-bg: linear-gradient(135deg, #0f766e, #115e59);
      --btn-gradient: linear-gradient(135deg, #0d9488, #0f766e);
      --input-focus: #2dd4bf;
    }
    html.night[data-theme="amber"] {
      --accent: #fbbf24; --accent-dark: #d97706; --accent-rgb: 251, 191, 36;
      --accent-gradient: linear-gradient(135deg, #fde68a, #fbbf24);
      --table-header-bg: linear-gradient(135deg, #b45309, #92400e);
      --btn-gradient: linear-gradient(135deg, #d97706, #b45309);
      --input-focus: #fbbf24;
    }
    html.night[data-theme="ruby"] {
      --accent: #f87171; --accent-dark: #dc2626; --accent-rgb: 248, 113, 113;
      --accent-gradient: linear-gradient(135deg, #fca5a5, #f87171);
      --table-header-bg: linear-gradient(135deg, #b91c1c, #991b1b);
      --btn-gradient: linear-gradient(135deg, #dc2626, #b91c1c);
      --input-focus: #f87171;
    }
    html.night[data-theme="rose"] {
      --accent: #f472b6; --accent-dark: #db2777; --accent-rgb: 244, 114, 182;
      --accent-gradient: linear-gradient(135deg, #fbcfe8, #f472b6);
      --table-header-bg: linear-gradient(135deg, #be185d, #9d174d);
      --btn-gradient: linear-gradient(135deg, #db2777, #be185d);
      --input-focus: #f472b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--app-bg);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }

    #toolbar {
      background: var(--command-block-bg);
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      transition: background-color 0.3s, border-color 0.3s;
    }
    #toolbar label { font-size: 12px; color: var(--text-muted); }
    #toolbar input {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 13px;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }
    #toolbar input:focus {
      outline: none;
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    #toolbar input[type=number] { width: 70px; }
    #toolbar input[type=text], #toolbar input[type=password] { width: 130px; }
    /* Кастомный дропдаун истории ПК (datalist фильтрует по значению поля —
       показывал только 1 совпадение, поэтому свой список) */
    .host-wrap { position: relative; display: inline-block; }
    .host-wrap #host { width: 130px; padding-right: 22px; }
    .host-toggle {
      position: absolute;
      right: 3px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      line-height: 1;
      padding: 2px 3px;
    }
    .host-toggle:hover { color: var(--accent); }
    .host-drop {
      position: absolute;
      top: calc(100% + 3px);
      left: 0;
      z-index: 50;
      min-width: 100%;
      background: var(--modal-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .host-opt {
      display: block;
      width: 100%;
      padding: 5px 8px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
    }
    .host-opt:hover { background: var(--accent-soft); color: var(--accent); }
    .host-opt-empty { padding: 5px 8px; color: var(--text-muted); font-size: 12px; }
    #toolbar select {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 13px;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }
    #toolbar select:focus {
      outline: none;
      border-color: var(--input-focus);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    /* Чекбоксы (галки) — цвет по теме панели */
    input[type="checkbox"] {
      accent-color: var(--accent);
    }
    #connectBtn {
      background: var(--btn-gradient);
      color: var(--btn-text);
      border: none;
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      box-shadow: var(--btn-shadow);
      transition: box-shadow 0.2s, filter 0.2s;
    }
    #connectBtn:hover { box-shadow: var(--btn-hover-shadow); filter: brightness(1.05); }
    #connectBtn.connected { background: var(--btn-success); background-image: none; }
    #connectBtn.connected:hover { background: var(--btn-success); background-image: none; filter: brightness(1.1); }
    #micBtn {
      background: var(--btn-gradient);
      color: var(--btn-text);
      border: none;
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      box-shadow: var(--btn-shadow);
      transition: box-shadow 0.2s, filter 0.2s;
      opacity: 1;
    }
    #micBtn:hover { box-shadow: var(--btn-hover-shadow); filter: brightness(1.05); }
    #micBtn:disabled { cursor: not-allowed; opacity: 0.35; }
    #micBtn.armed { opacity: 1; outline: 2px solid var(--btn-success); }
    #micBtn.live { opacity: 1; background: var(--btn-danger); background-image: none; }
    #miniMic {
      font-size: 12px; color: var(--text-muted); white-space: nowrap;
      background: none; border: none; padding: 0 2px; cursor: pointer; font-family: inherit;
    }
    #miniMic.live { color: var(--btn-danger); font-weight: bold; }
    #miniLevel {
      width: 44px; height: 4px; border-radius: 2px; overflow: hidden; flex-shrink: 0;
      background: var(--input-bg); border: 1px solid var(--input-border);
    }
    #miniLevel i { display: block; height: 100%; width: 0; background: var(--btn-success); }
    #miniConnBtn {
      font-size: 11px; padding: 2px 8px; border: none; border-radius: 3px; white-space: nowrap;
      background: var(--btn-gradient); color: var(--btn-text); cursor: pointer;
      box-shadow: var(--btn-shadow); transition: box-shadow 0.2s, filter 0.2s;
    }
    #miniConnBtn:hover { box-shadow: var(--btn-hover-shadow); filter: brightness(1.05); }
    /* Индикатор уровня микрофона (пик сигнала, обновляется из micProcess) */
    #micLevel {
      display: inline-block;
      width: 52px;
      height: 8px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 3px;
      overflow: hidden;
      vertical-align: middle;
    }
    #micLevel i { display: block; height: 100%; width: 0%; background: var(--btn-success); }
    #micDevice { max-width: 150px; font-size: 12px; }
    #fitBtn, #fsBtn {
      background: var(--btn-gradient);
      color: var(--btn-text);
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      box-shadow: var(--btn-shadow);
      transition: box-shadow 0.2s, filter 0.2s;
    }
    #fitBtn:hover, #fsBtn:hover { box-shadow: var(--btn-hover-shadow); filter: brightness(1.05); }
    #fitBtn.on { background: var(--btn-success); background-image: none; }
    /* «Вписать»: canvas масштабируется CSS-ом (координаты мыши считает canvasXY) */
    #canvasWrapper.fit { overflow: hidden; align-items: center; }
    #canvasWrapper.fit #rdpCanvas { width: auto; height: auto; max-width: 100%; max-height: 100%; }
    #status { font-size: 12px; color: var(--text-muted); margin-left: 8px; }

    #canvasWrapper {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #000;
    }
    #rdpCanvas {
      display: block;
      cursor: none;
      outline: none;
    }

    /* Тонкий темизированный скроллбар в стиле панели Entware Manager */
    #canvasWrapper::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    #canvasWrapper::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
    }
    #canvasWrapper::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 4px;
    }
    #canvasWrapper::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }
    #canvasWrapper {
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }

    /* ── Сворачивание панели управления ─────────────────────────────── */
    #toolbar.collapsed { display: none; }

    /* Кнопка-стрелка в стиле панели: тонкий chevron через border */
    .collapse-arrow {
      background: none;
      border: none;
      color: var(--text-secondary);
      width: 24px;
      height: 24px;
      padding: 0;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 6px;
      transition: background-color 0.2s, color 0.2s;
      /* Пульсация стрелки в цвет темы — заметна и в тулбаре, и в островке */
      animation: collapseArrowPulse 2.4s ease-in-out infinite;
    }
    @keyframes collapseArrowPulse {
      0%, 100% { color: var(--text-secondary); text-shadow: none; }
      50%      { color: var(--accent); text-shadow: 0 0 6px var(--accent-glow), 0 0 12px var(--accent-glow); }
    }
    .collapse-arrow:hover {
      background: var(--accent-soft);
      color: var(--accent);
      animation: none;
    }
    .collapse-arrow i {
      width: 8px;
      height: 8px;
      border: solid currentColor;
      border-width: 0 2px 2px 0;
      display: inline-block;
      box-sizing: border-box;
    }
    .collapse-arrow.up i { transform: rotate(225deg); margin-top: 4px; }
    .collapse-arrow.down i { transform: rotate(45deg); margin-bottom: 4px; }

    /* Плавающий островок при свёрнутой панели: зона хвата + кнопка + FPS + пинг */
    #miniPanel {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
      background: var(--command-block-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      transition: background-color 0.3s, border-color 0.3s;
      cursor: move;
      user-select: none;
    }
    #miniPanel.visible { display: flex; }
    #miniPanel.dragging { opacity: 0.85; cursor: grabbing; }
    #miniGrip {
      width: 4px;
      height: 18px;
      border-left: 2px solid var(--border-color);
      border-right: 2px solid var(--border-color);
      border-radius: 1px;
      cursor: move;
      flex-shrink: 0;
    }
    #miniFps { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    #miniPing { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    #miniPagePing { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  </style>
  <script>
    // Синхронизация темы с панелью Entware Manager.
    // В iframe (тот же origin) копируем актуальные CSS-переменные из родителя —
    // любой пресет и день/ночь применяются автоматически. При standalone-открытии
    // (новая вкладка) — читаем localStorage панели + свои fallback-переменные выше.
    (function() {
      'use strict';
      var root = document.documentElement;
      var VARS = [
        '--bg-gradient', '--app-bg', '--app-border', '--sidebar-bg', '--sidebar-border',
        '--content-bg', '--text-primary', '--text-secondary', '--text-muted',
        '--accent', '--accent-dark', '--accent-rgb', '--accent-gradient', '--accent-soft',
        '--accent-glow', '--table-header-bg', '--btn-gradient', '--border-color',
        '--table-bg', '--table-row-even', '--table-row-hover', '--input-bg', '--input-border',
        '--input-focus', '--modal-bg', '--pre-bg', '--shadow', '--shadow-lg', '--progress-bg',
        '--command-block-bg', '--note-border', '--btn-bg', '--btn-text', '--btn-shadow',
        '--btn-hover-shadow', '--btn-disabled-opacity', '--btn-success', '--btn-danger',
        '--btn-muted', '--scrollbar-thumb', '--scrollbar-track'
      ];

      function applyStorageTheme() {
        try {
          var theme = localStorage.getItem('entware_theme') || 'violet';
          var nightRaw = localStorage.getItem('entware_night');
          var night = nightRaw === null ? (new Date().getHours() >= 20 || new Date().getHours() < 6) : nightRaw === '1';
          root.setAttribute('data-theme', theme);
          if (night) root.classList.add('night'); else root.classList.remove('night');
        } catch (e) {}
      }

      function syncFromParent() {
        try {
          if (window.parent === window) return false;
          var pRoot = window.parent.document.documentElement;
          var theme = pRoot.getAttribute('data-theme');
          if (!theme) return false;
          var cs = window.parent.getComputedStyle(pRoot);
          for (var i = 0; i < VARS.length; i++) {
            var v = cs.getPropertyValue(VARS[i]).trim();
            if (v) root.style.setProperty(VARS[i], v);
          }
          root.setAttribute('data-theme', theme);
          if (pRoot.classList.contains('night')) root.classList.add('night');
          else root.classList.remove('night');
          return true;
        } catch (e) {
          return false;
        }
      }

      function watchParent() {
        try {
          if (window.parent === window) return;

  <script>
    const go = new Go();
    let connected = false;
    let everConnected = false;   // были ли уже подключены (текст кнопки в островке)

    // ── Cookie helpers ────────────────────────────────────────────────────────
    function setCookie(name, value) {
      document.cookie = encodeURIComponent(name) + '=' + encodeURIComponent(value) +
        '; max-age=31536000; SameSite=Strict';
    }
    function getCookie(name) {
      const key = encodeURIComponent(name) + '=';
      for (const part of document.cookie.split(';')) {
        const s = part.trim();
        if (s.startsWith(key)) return decodeURIComponent(s.slice(key.length));
      }
      return null;
    }
    function loadCookies() {
      const fields = ['host', 'port', 'domain', 'width', 'height'];
      for (const id of fields) {
        const v = getCookie('rdp_' + id);
        if (v !== null) document.getElementById(id).value = v;
      }
      const sam = getCookie('rdp_swapAltMeta');
      if (sam !== null) document.getElementById('swapAltMeta').checked = (sam === '1');
      const noh = getCookie('rdp_noH264');
      if (noh !== null) document.getElementById('noH264').checked = (noh === '1');
      const ac = getCookie('rdp_always_cursor');
      if (ac !== null) document.getElementById('alwaysCursor').checked = (ac === '1');
      const md = getCookie('rdp_micdiag');
      const mdEl = document.getElementById('micDiag');
      if (mdEl && md !== null) mdEl.checked = (md === '1');
      if (getCookie('rdp_fit') === '1') applyFit(true);
      const preset = getCookie('rdp_preset');
      if (preset && PRESETS[preset]) {
        document.getElementById('preset').value = preset;
        applyPreset();
      } else {
        const qd = getCookie('rdp_queueDepth');
        if (qd !== null) {
          const el = document.getElementById('queueDepth');
          if (el) el.value = qd;
        }
      }
    }
    // Stream presets: width/height + queueDepth hint (grdp SetQueueDepthHint:
    // 0 = no throttle (max quality), larger = heavier throttle of rate/quality).
    // В режиме «Битмапы» качество напрямую зависит от queueDepth: 0 = чётко.
    const PRESETS = {
      compact:  { width: 1024, height: 600, depth: 10 },
      balanced: { width: 1280, height: 800, depth: 5 },
      crisp:    { width: 1920, height: 1080, depth: 0 },
      custom:   { width: 0,    height: 0,    depth: 0 },
    };

    function applyPreset() {
      const name = document.getElementById('preset').value;
      const p = PRESETS[name];
      if (!p) return;
      if (name !== 'custom') {
        document.getElementById('width').value = p.width;
        document.getElementById('height').value = p.height;
      }
      const qd = document.getElementById('queueDepth');
      if (qd) qd.value = p.depth;
      saveCookies();
    }

    function saveCookies() {
      for (const id of ['host', 'port', 'domain', 'width', 'height']) {
        setCookie('rdp_' + id, document.getElementById(id).value.trim());
      }
      setCookie('rdp_swapAltMeta', document.getElementById('swapAltMeta').checked ? '1' : '0');
      setCookie('rdp_noH264', document.getElementById('noH264').checked ? '1' : '0');
      setCookie('rdp_always_cursor', document.getElementById('alwaysCursor').checked ? '1' : '0');
      const md = document.getElementById('micDiag');
      if (md) setCookie('rdp_micdiag', md.checked ? '1' : '0');
      const qd = document.getElementById('queueDepth');
      if (qd) setCookie('rdp_queueDepth', qd.value);
      const pr = document.getElementById('preset');
      if (pr) setCookie('rdp_preset', pr.value);
    }

    // ── Сворачивание панели управления ───────────────────────────────────────
    // Свёрнутая панель заменяется плавающим островком (#miniPanel) с кнопкой
    // «Параметры» для раскрытия и счётчиком FPS. Состояние — cookie rdp_collapsed.
    function initCollapse() {
      const toolbar = document.getElementById('toolbar');
      const mini = document.getElementById('miniPanel');
      const collapseBtn = document.getElementById('collapseBtn');
      const expandBtn = document.getElementById('expandBtn');
      if (!toolbar || !mini) return;

      function setCollapsed(collapsed) {
        toolbar.classList.toggle('collapsed', collapsed);
        mini.classList.toggle('visible', collapsed);
        setCookie('rdp_collapsed', collapsed ? '1' : '0');
      }

      const saved = getCookie('rdp_collapsed');
      setCollapsed(saved === '1');

      if (collapseBtn) collapseBtn.onclick = function() { setCollapsed(true); };
      if (expandBtn) expandBtn.onclick = function() { setCollapsed(false); };
      updateMiniConn();

      // ── Перетаскивание островка ─────────────────────────────────────────────
      // Зона захвата — #miniGrip (и вся панель). Позиция сохраняется в cookie
      // rdp_mini_pos (JSON {x,y} от верхнего левого угла окна).
      const savedPos = getCookie('rdp_mini_pos');
      if (savedPos) {
        try {
          const p = JSON.parse(savedPos);
          if (typeof p.x === 'number' && typeof p.y === 'number') {
            mini.style.left = p.x + 'px';
            mini.style.top = p.y + 'px';
            mini.style.right = 'auto';

        } catch (_) {}
      }

      let dragStartX = 0, dragStartY = 0, dragBaseX = 0, dragBaseY = 0, dragging = false;

      function onDragMove(e) {
        if (!dragging) return;
        const dx = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX)) - dragStartX;
        const dy = (e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY)) - dragStartY;
        let nx = dragBaseX + dx;
        let ny = dragBaseY + dy;
        nx = Math.max(0, Math.min(window.innerWidth - mini.offsetWidth, nx));
        ny = Math.max(0, Math.min(window.innerHeight - mini.offsetHeight, ny));
        mini.style.left = nx + 'px';
        mini.style.top = ny + 'px';
        mini.style.right = 'auto';
      }

      function onDragEnd() {
        if (!dragging) return;
        dragging = false;
        mini.classList.remove('dragging');
        document.removeEventListener('mousemove', onDragMove);
        document.removeEventListener('mouseup', onDragEnd);
        document.removeEventListener('touchmove', onDragMove);
        document.removeEventListener('touchend', onDragEnd);
        try {
          setCookie('rdp_mini_pos', JSON.stringify({
            x: parseInt(mini.style.left, 10) || 0,
            y: parseInt(mini.style.top, 10) || 0
          }));
        } catch (_) {}
      }

      function onDragStart(e) {
        // не перетаскиваем, если клик пришёлся по кнопке (раскрытие,
        // подключение, микрофон, диагностика) — иначе клик по ним съедается
        if (e.target && e.target.closest && e.target.closest('button')) return;
        dragging = true;
        mini.classList.add('dragging');
        const cx = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
        const cy = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
        dragStartX = cx;
        dragStartY = cy;
        dragBaseX = mini.offsetLeft;
        dragBaseY = mini.offsetTop;
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup', onDragEnd);
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('touchend', onDragEnd);
        e.preventDefault();
      }

      const grip = document.getElementById('miniGrip');
      if (grip) {

        grip.addEventListener('touchstart', onDragStart, { passive: false });
      }

      mini.addEventListener('mousedown', onDragStart);
      mini.addEventListener('touchstart', onDragStart, { passive: false });

    const HOST_HISTORY_COOKIE = 'rdp_host_history';
    const HOST_HISTORY_MAX = 5;

    function loadHostHistory() {
      const drop = document.getElementById('hostDrop');
      if (!drop) return;
      const raw = getCookie(HOST_HISTORY_COOKIE);
      let hosts = [];
      if (raw) {
        try { hosts = JSON.parse(raw); } catch (_) { hosts = []; }
      }
      drop.innerHTML = '';
      if (hosts.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'host-opt-empty';
        empty.textContent = 'История пуста';
        drop.appendChild(empty);
        return;

          const opt = document.createElement('button');
          opt.type = 'button';
          opt.className = 'host-opt';
          opt.textContent = h;
          opt.onclick = function() {
            document.getElementById('host').value = h;
            hideHostDrop();

          drop.appendChild(opt);
        })(hosts[i]);
      }
    }

    function showHostDrop() {
      const drop = document.getElementById('hostDrop');
      if (!drop) return;
      loadHostHistory();
      drop.hidden = false;
    }
    function hideHostDrop() {
      const drop = document.getElementById('hostDrop');
      if (drop) drop.hidden = true;

    function toggleHostDrop() {
      const drop = document.getElementById('hostDrop');
      if (!drop) return;
      if (drop.hidden) showHostDrop(); else hideHostDrop();

      if (wrap && !wrap.contains(e.target)) hideHostDrop();

    function rememberHost(host) {
      if (!host) return;
      const raw = getCookie(HOST_HISTORY_COOKIE);
      let hosts = [];
      if (raw) {
        try { hosts = JSON.parse(raw); } catch (_) { hosts = []; }
      }
      hosts = hosts.filter(function(h) { return h !== host; });
      hosts.unshift(host);
      if (hosts.length > HOST_HISTORY_MAX) hosts.length = HOST_HISTORY_MAX;
      setCookie(HOST_HISTORY_COOKIE, JSON.stringify(hosts));
      loadHostHistory();

    loadCookies();
    loadHostHistory();
    initCollapse();
    const hostToggleEl = document.getElementById('hostToggle');
    if (hostToggleEl) hostToggleEl.onclick = toggleHostDrop;

    // AudioContext is created in doConnect() while a user gesture is active,

      if (bitsPerSample === 16) {

      src.buffer = audioBuf;
      src.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (audioNextAt < now + AUDIO_LOOKAHEAD) audioNextAt = now + AUDIO_LOOKAHEAD;
      if (audioNextAt > now + AUDIO_MAX_QUEUE)  audioNextAt = now + AUDIO_LOOKAHEAD;

      audioNextAt += audioBuf.duration;
